name: Feedback clerk — on open
on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  triage-open:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate steersman-feedback App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.STEERSMAN_FEEDBACK_APP_ID }}
          private-key: ${{ secrets.STEERSMAN_FEEDBACK_PRIVATE_KEY }}

      - name: Label + thank-you as App
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const issue_number = issue.number;
            const body = issue.body || '';
            const title = issue.title || '';
            const text = `${title}\n${body}`.toLowerCase();

            const labels = new Set(['triage:needs-triage']);

            if (/###\s*product\s*\n\s*solve\b/i.test(body) || /\bproduct:\s*solve\b/i.test(text)) {
              labels.add('product:solve');
            } else if (/###\s*product\s*\n\s*other\b/i.test(body)) {
              labels.add('product:other');
            }

            if (/did not solve|timed out|kind:failed-solve/i.test(text)) {
              labels.add('kind:failed-solve');
            }
            if (/wrong result|wrong plate|kind:wrong-result/i.test(text)) {
              labels.add('kind:wrong-result');
            }

            for (const name of labels) {
              try {
                await github.rest.issues.createLabel({
                  owner, repo, name,
                  color: name.startsWith('triage:') ? 'fbca04'
                    : name.startsWith('product:') ? '1d76db'
                    : 'd93f0b',
                  description: name,
                });
              } catch (e) {
                if (e.status !== 422) throw e;
              }
            }

            await github.rest.issues.addLabels({
              owner, repo, issue_number,
              labels: [...labels],
            });

            const thankYou = [
              'Thanks for the report — a human will review it.',
              '',
              '- Attach the image that failed to solve.',
              '- Please include any solution hints you have.',
              '- We may use the attachment only to reproduce the issue.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: thankYou,
            });
